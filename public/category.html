<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category - Island Nutrition</title>
  <meta name="description" content="Browse products in this category at Island Nutrition.">
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <script>
    (function() {
      try {
        var s = localStorage.getItem('in_theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', s);
      } catch(e) {}
    })();
  </script>
  <!-- Preconnect for faster external resource loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <!-- Google Fonts loaded directly in parallel -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
  <link rel="stylesheet" href="/css/style.css?v=6.0">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar scrolled" id="navbar">
    <div class="container">
      <a href="/" class="nav-logo">
        <img src="/assets/images/island-logo-black.png" alt="Island Nutrition" class="theme-logo logo-dark-variant">
        <img src="/assets/images/island-logo-white.png" alt="Island Nutrition" class="theme-logo logo-white-variant">
        <span class="nav-logo-text">ISLAND NUTRITION</span>
      </a>
      <div class="nav-links" id="nav-links">
        <a href="/" class="nav-link">Home</a>
        <a href="/products.html" class="nav-link active">Products</a>
        <a href="/about.html" class="nav-link">About</a>
        <a href="/contact.html" class="nav-link">Contact</a>
        <button class="nav-search-btn" aria-label="Search products" title="Search products">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
        <button class="theme-toggle-btn" aria-label="Toggle theme" title="Toggle theme">
          <span class="theme-toggle-icon"></span>
        </button>
      </div>
      <div class="nav-actions-mobile">
        <button class="nav-search-btn nav-search-mobile" aria-label="Search products" title="Search products">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
        <button class="theme-toggle-btn theme-toggle-mobile" aria-label="Toggle theme" title="Toggle theme">
          <span class="theme-toggle-icon"></span>
        </button>
        <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Breadcrumb -->
  <div class="breadcrumb">
    <div class="container">
      <div class="breadcrumb-list">
        <a href="/">Home</a>
        <span class="separator">/</span>
        <a href="/products.html">Products</a>
        <span class="separator">/</span>
        <span class="current" id="breadcrumb-category">Loading...</span>
      </div>
    </div>
  </div>

  <!-- Page Content -->
  <section class="section-sm">
    <div class="container">
      <h1 class="section-title" id="category-title" style="font-size: clamp(2rem, 4vw, 3rem); font-weight: 900; margin-bottom: 48px; text-transform: uppercase; letter-spacing: -0.5px;">Loading...</h1>

      <!-- Products Grid -->
      <div class="products-grid" id="products-grid">
        <div class="loading-spinner" style="grid-column:1/-1"><div class="spinner"></div></div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-brand">
          <a href="/" class="nav-logo">
            <img src="/assets/images/island-logo-black.png" alt="Island Nutrition" class="theme-logo logo-dark-variant">
            <img src="/assets/images/island-logo-white.png" alt="Island Nutrition" class="theme-logo logo-white-variant">
            <span class="nav-logo-text">ISLAND NUTRITION</span>
          </a>
          <p style="margin-top: 16px;">Quality supplements crafted for peak performance.</p>
        </div>
        <div class="footer-col">
          <h4>Connect</h4>
          <ul>
            <li><a href="#">Instagram</a></li>
            <li><a href="mailto:info@island-nutrition.co">info@island-nutrition.co</a></li>
          </ul>
        </div>
      </div>
      <div class="footer-badges">
        <picture>
          <source srcset="/assets/images/certified_badges.webp" type="image/webp">
          <img src="/assets/images/certified_badges.png" alt="Island Nutrition Quality Certifications - 100% Premium Quality, Halal Certified, Swedish Quality" class="footer-certified-badges" width="280" height="85" loading="lazy">
        </picture>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2026 Island Nutrition. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <button class="back-to-top" aria-label="Back to top"><i class="fa-solid fa-arrow-up"></i></button>

  <script src="/js/app.js?v=3.5"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadCategoryProducts();
    });
  </script>
</body>
</html>
