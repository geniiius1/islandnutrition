<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Island Nutrition</title>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>

  <div class="login-page">
    <div class="login-bg"></div>

    <div class="login-card">
      <div class="login-logo">
        <img src="/assets/images/island-logo-white.png" alt="Island Nutrition" style="width: 84px; height: 84px; object-fit: contain; margin: 0 auto 14px;">
        <h2 style="font-family: var(--font-heading); font-size: 1.35rem; font-weight: 900; letter-spacing: 2px; color: #ffffff;">
          ISLAND NUTRITION
        </h2>
        <p style="color: var(--admin-text-muted); font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; margin-top: 6px;">Quality Supplements CMS</p>
      </div>

      <div class="login-error" id="login-error"></div>

      <form class="login-form" onsubmit="handleLogin(event)">
        <div class="form-group" style="margin-bottom: 16px;">
          <label for="login-username" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--admin-text-secondary);">Username</label>
          <input type="text" id="login-username" required placeholder="admin" autocomplete="username">
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label for="login-password" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--admin-text-secondary);">Password</label>
          <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password">
        </div>

        <button type="submit" class="btn-login">Sign In to Dashboard</button>
      </form>

      <div style="text-align: center; margin-top: 24px;">
        <a href="/" style="font-size: 0.85rem; color: var(--admin-text-muted); transition: color 0.2s;" onmouseover="this.style.color='#ffffff'" onmouseout="this.style.color='var(--admin-text-muted)'">
          <i class="fa-solid fa-arrow-left" style="margin-right:6px;"></i> Return to Public Showroom
        </a>
      </div>
    </div>
  </div>

  <script src="/admin/js/admin.js?v=2"></script>
</body>
</html>
